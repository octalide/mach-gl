name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  MACH_VERSION: v1.5.0

jobs:
  generate:
    name: Generation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated sources against the registry
        run: python3 tools/gen.py check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MACH_VERSION" -R octalide/mach -p mach -D /usr/local/bin
          chmod +x /usr/local/bin/mach

      - name: Sync dependencies
        run: mach dep pull

      # the binding links nothing: no system GL, no glfw, no display.
      - name: Test
        run: mach test

  demo:
    name: Demo Build
    # ubuntu 24.04 ships GLFW 3.4, which carries the symbols mach-glfw references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MACH_VERSION" -R octalide/mach -p mach -D /usr/local/bin
          chmod +x /usr/local/bin/mach

      - name: Install GLFW
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev

      - name: Sync demo dependencies
        working-directory: examples/demo
        run: mach dep pull

      - name: Build demo
        working-directory: examples/demo
        run: |
          set -euo pipefail
          mach build
          test -x out/linux/bin/demo || { echo "::error::mach build produced no demo binary"; exit 1; }
